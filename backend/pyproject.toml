[project]
name = "briefscanner-backend"
version = "0.1.0"
description = "BriefScanner API: analyses photographed German letters with Claude."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "anthropic",
    "pillow",
    "pypdf",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
