server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Privacy: never log requests (URLs and client addresses are not needed to run this service).
    access_log off;

    # 10 MB of pages plus multipart overhead
    client_max_body_size 12m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Overwrite (never append to) any client-supplied value so the rate limit cannot be spoofed.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The service worker and its manifest must always be revalidated so updates reach users.
    location ~ ^/(ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
